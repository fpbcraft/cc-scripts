name: Tidebound v5 tests

on:
  push:
    paths:
      - 'tidebound/**'
      - 'install-tidebound.lua'
      - '.github/workflows/tidebound-tests.yml'
  pull_request:
    paths:
      - 'tidebound/**'
      - 'install-tidebound.lua'
      - '.github/workflows/tidebound-tests.yml'

jobs:
  v5-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Check v5 Lua syntax
        run: |
          find tidebound/expanse-v5 tidebound/tests -name '*.lua' -print0 | xargs -0 -n1 luac5.3 -p
          luac5.3 -p tidebound/tidebound.lua install-tidebound.lua tidebound/tidebound-shattered-v4.lua
      - name: Test 4X simulation, AI, touchscreen and layout
        run: lua5.3 tidebound/tests/v5.lua