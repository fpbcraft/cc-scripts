name: IRONSPIRE checks
on:
  pull_request:
    paths:
      - 'ironspire/**'
      - 'install-ironspire.lua'
      - '.github/workflows/ironspire.yml'
  push:
    paths:
      - 'ironspire/**'
      - 'install-ironspire.lua'
      - '.github/workflows/ironspire.yml'
jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Syntax-check
        run: |
          find ironspire -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
          luac5.4 -p install-ironspire.lua
      - name: Gameplay and renderer smoke test
        run: lua5.4 ironspire/tests/run.lua
