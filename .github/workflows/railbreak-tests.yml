name: Railbreak Lua tests

on:
  push:
    paths:
      - 'lib/**'
      - 'games/railbreak/**'
      - 'installers/railbreak.lua'
      - '.github/workflows/railbreak-tests.yml'
  pull_request:
    paths:
      - 'lib/**'
      - 'games/railbreak/**'
      - 'installers/railbreak.lua'
      - '.github/workflows/railbreak-tests.yml'

jobs:
  lua-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Simulate CC:Tweaked module resolution and game boot
        run: lua5.3 games/railbreak/tests/boot.lua
      - name: Emulator aspect ratios and touch alignment
        run: lua5.3 games/railbreak/tests/aspect.lua
      - name: Monitor text scale 0.5 and restoration
        run: lua5.3 games/railbreak/tests/scale.lua
      - name: Train-first campaign and responsive UI
        run: lua5.3 games/railbreak/tests/train.lua
      - name: Original factory edition regressions
        run: lua5.3 games/railbreak/tests/run.lua
      - name: Installer rollback and save preservation
        run: lua5.3 games/railbreak/tests/installer.lua
