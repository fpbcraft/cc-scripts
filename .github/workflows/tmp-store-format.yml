name: Temporary FPB Store formatter
on:
  pull_request:

permissions:
  contents: write

jobs:
  format-store:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'codex/fpbstore-craftos-redesign-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Format Lua with StyLua
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: .
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.lua'
          if ! git diff --cached --quiet; then
            git commit -m "style(store): apply StyLua formatting"
            git push origin HEAD:codex/fpbstore-craftos-redesign-v2
          fi
