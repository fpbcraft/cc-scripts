# One-time formatter migration. Remove this workflow after the normalization commit.
name: One-time Lua normalization

on:
  push:
    branches: [chore/enforce-lua-style]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: .
      - name: Commit normalized Lua files
        run: |
          git add -- '*.lua'
          if git diff --cached --quiet; then
            echo "All Lua files are already formatted"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'style: normalize existing Lua files with StyLua'
          git push origin HEAD:chore/enforce-lua-style
