name: One-time Lua normalization

on:
  push:
    branches: [chore/enforce-lua-style]

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.6.0
          args: false
      - name: Normalize until StyLua is stable
        run: |
          for pass in $(seq 1 12); do
            echo "StyLua pass $pass"
            stylua .
            if stylua --check . >/dev/null 2>&1; then
              echo "Formatting stable after $pass passes"
              break
            fi
          done
          stylua --check --output-format summary .
      - name: Commit normalized Lua files
        run: |
          git add -- '*.lua'
          if git diff --cached --quiet; then
            echo "Lua baseline was already stable"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m 'style: converge StyLua normalization'
          git push origin HEAD:chore/enforce-lua-style
