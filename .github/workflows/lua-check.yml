name: CC Lua quality
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Syntax check all Lua files
        run: |
          find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.3 -p
      - name: FPB Store catalog and safe lifecycle
        run: lua5.3 tests/fpbstore_test.lua
      - name: CIVCRAFT local hotseat multiplayer
        run: lua5.3 tests/civcraft_hotseat_test.lua
      - name: CIVCRAFT responsive graphics and touch
        run: lua5.3 tests/civcraft_ui_test.lua
      - name: Store launch without package and require
        run: lua5.3 tests/fpbstore_package_free_boot_test.lua
      - name: Store self-update button without shell or package
        run: lua5.3 tests/fpbstore_ui_self_update_test.lua
      - name: Store full self-update without Lua package API
        run: lua5.3 tests/fpbstore_self_update_test.lua
      - name: Native graphics and responsive backend regression
        run: lua5.3 tests/native_graphics_backends_test.lua
      - name: Computer-only terminal fallback
        run: lua5.3 tests/computer_terminal_test.lua
      - name: COGWORKS kinetic puzzle tests
        run: lua5.3 tests/cogworks_test.lua
      - name: COGWORKS new mechanical block tests
        run: lua5.3 tests/cogworks_mechanics_test.lua
      - name: COGWORKS three save slots and settings
        run: lua5.3 tests/cogworks_storage_test.lua
      - name: COGWORKS graphics and touch regression
        run: lua5.3 tests/cogworks_renderer_test.lua
      - name: COGWORKS monitor scale and event integration
        run: lua5.3 tests/cogworks_main_test.lua
      - name: COGWORKS installer rollback and saves
        run: lua5.3 tests/cogworks_installer_test.lua
      - name: Factory core mock tests
        run: lua5.3 tests/core_test.lua
      - name: Airship Basalt mock UI
        run: lua5.3 tests/airship_ui_test.lua
      - name: Airship controller/timer integration
        run: lua5.3 tests/airship_core_integration_test.lua
      - name: Airship installer migration/rollback
        run: lua5.3 tests/airship_installer_test.lua
      - name: Airship keyboard/paste mock UI
        run: lua5.3 tests/airship_keyboard_test.lua
      - name: CraftOS module loader regression
        run: lua5.3 tests/loader_test.lua
      - name: Peripheral discovery and telemetry tests
        run: lua5.3 tests/devices_test.lua
      - name: Context-sensitive editor suggestions
        run: lua5.3 tests/completions_test.lua
      - name: Remote node discovery and expiry
        run: lua5.3 tests/remote_test.lua
      - name: Responsive Overview chart layout
        run: lua5.3 tests/layout_test.lua
      - name: HMAC-SHA256 authentication vectors
        run: lua5.3 tests/auth_test.lua
      - name: Paired authenticated remote switching
        run: lua5.3 tests/paired_remote_test.lua
      - name: Remote node disk-export GUI
        run: lua5.3 tests/node_ui_test.lua
      - name: Power Grid graph visibility
        run: lua5.3 tests/graph_metrics_test.lua
      - name: Unicode text compatibility
        run: lua5.3 tests/ui_compat_test.lua
      - name: Adaptive chart sizing
        run: lua5.3 tests/responsive_layout_test.lua
      - name: Independent displays and drag-drop
        run: lua5.3 tests/multi_screen_test.lua
      - name: Display discovery and compact fallback
        run: lua5.3 tests/screen_manager_test.lua
