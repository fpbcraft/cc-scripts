name: CC Lua quality
on:
  push:
    branches: [main]
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Syntax check all Lua files
        run: |
          find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.3 -p

  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Run application, library and installer regressions
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 9
        run: |
          set -euo pipefail
          python3 scripts/ci_lua_tests.py --shard "$SHARD" --shards "$SHARDS"

  # Keep the existing required check name while ensuring every shard passes.
  test:
    if: always()
    needs: [syntax, regressions]
    runs-on: ubuntu-latest
    steps:
      - name: Verify Lua syntax and all regression shards passed
        run: |
          test "${{ needs.syntax.result }}" = "success"
          test "${{ needs.regressions.result }}" = "success"
