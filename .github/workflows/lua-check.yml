name: CC Lua quality
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Syntax check all Lua files
        run: |
          find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.3 -p
      - name: Factory core mock tests
        run: lua5.3 tests/core_test.lua
      - name: Airship Basalt mock UI
        run: lua5.3 tests/airship_ui_test.lua
      - name: Airship controller/timer integration
        run: lua5.3 tests/airship_core_integration_test.lua
      - name: Airship installer migration/rollback
        run: lua5.3 tests/airship_installer_test.lua
      - name: Airship keyboard/paste mock UI
        run: lua5.3 tests/airship_keyboard_test.lua
      - name: Recorded routes and stations integration
        run: lua5.3 tests/airship_route_features_test.lua
      - name: Route planner touchscreen and keyboard
        run: lua5.3 tests/airship_route_ui_test.lua
      - name: Airship altitude feedback and power UI
        run: lua5.3 tests/airship_altitude_power_test.lua
      - name: CraftOS module loader regression
        run: lua5.3 tests/loader_test.lua

