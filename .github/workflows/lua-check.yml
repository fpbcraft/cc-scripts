name: CC Lua quality
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3
      - name: Syntax check all Lua files
        run: |
          find . -type f -name '*.lua' -not -path './.git/*' -print0 | xargs -0 -n1 luac5.3 -p
      - name: Factory core mock tests
        run: lua5.3 tests/core_test.lua
      - name: CraftOS module loader regression
        run: lua5.3 tests/loader_test.lua
      - name: Peripheral discovery and telemetry tests
        run: lua5.3 tests/devices_test.lua
      - name: Context-sensitive editor suggestions
        run: lua5.3 tests/completions_test.lua
      - name: Remote node discovery and expiry
        run: lua5.3 tests/remote_test.lua
      - name: Responsive Overview chart layout
        run: lua5.3 tests/layout_test.lua
      - name: HMAC-SHA256 authentication vectors
        run: lua5.3 tests/auth_test.lua
      - name: Paired authenticated remote switching
        run: lua5.3 tests/paired_remote_test.lua
